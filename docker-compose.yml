version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: greenstore_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: greenstore_db
      MYSQL_USER: greenstore_user
      MYSQL_PASSWORD: greenstore_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - greenstore_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: greenstore_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: greenstore_db
      DB_USER: greenstore_user
      DB_PASSWORD: greenstore_password
    ports:
      - "8080:8080"
    networks:
      - greenstore_net

volumes:
  db_data:

networks:
  greenstore_net: