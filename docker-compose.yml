version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: greenstore_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: greenstore_db
      MYSQL_USER: greenstore_user
      MYSQL_PASSWORD: greenstore_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - greenstore_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "greenstore_user", "-pgreenstore_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: greenstore_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: greenstore_db
      DB_USER: greenstore_user
      DB_PASSWORD: greenstore_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - greenstore_net

networks:
  greenstore_net:
    driver: bridge

volumes:
  db_data: